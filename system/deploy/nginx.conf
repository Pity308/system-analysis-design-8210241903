# ADC 员工端的 nginx 配置
#
# 三件事：托管静态文件、SPA 回退、把 /api 反代给后端容器。
# 浏览器只认一个地址，前后端同源，CORS 与 Cookie 域问题一次性消失。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 4m;

    # 压缩：SPA 的主包不小，gzip 后大约剩三分之一
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    # 安全响应头：Docker 网络里跑的是诊所业务，别让浏览器替我们猜类型
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # 接口反代。upstream 名 api 来自 compose 的服务名
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 报表与结算导出会稍慢，给 60 秒；再长就该改成异步任务了
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 带指纹的构建产物可以长缓存；index.html 不能缓存，否则发版后用户拿到旧壳
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA 回退：员工端用的是 hash 路由，理论上不需要，但留着防止以后换 history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }
}
