# ADC 安德鲁牙科连锁 —— 生产形态编排
#
# 三个容器，只有 web 对外暴露 80（上 HTTPS 后改 443）：
#   浏览器 → web(nginx:80) ─/api→ api(8080) → db(5432)
#
# 启动前先准备 .env（照 .env.example 抄一份）：
#   cp .env.example .env && 编辑口令与密钥
#   docker compose up -d --build
#
# 注意：数据库不映射端口。需要连库排障时用
#   docker compose exec db psql -U adc -d adc

name: adc

services:
  db:
    image: postgres:16-alpine
    container_name: adc-db
    environment:
      POSTGRES_DB: adc
      POSTGRES_USER: adc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 .env 设置 POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
      # 中文排序与大小写行为跟本机开发库保持一致
      LANG: C.UTF-8
    volumes:
      - adc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adc -d adc"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [adc-net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    container_name: adc-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/adc
      SPRING_DATASOURCE_USERNAME: adc
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # 两个签名密钥用 JSON 注入。
      # 不能写成 ADC_AUTH_TOKEN_SECRET：Spring 的宽松绑定会把它拆成 adc.auth.token.secret，
      # 与配置里的 adc.auth.token-secret 对不上，等于悄悄用了默认密钥。
      SPRING_APPLICATION_JSON: >-
        {"adc":{"auth":{"token-secret":"${ADC_AUTH_TOKEN_SECRET}"},
                "wx":{"token-secret":"${ADC_WX_TOKEN_SECRET}",
                      "app-id":"${ADC_WX_APP_ID:-}",
                      "app-secret":"${ADC_WX_APP_SECRET:-}"}}}
    expose:
      - "8080"
    restart: unless-stopped
    networks: [adc-net]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    container_name: adc-web
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped
    networks: [adc-net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # 数据卷独立命名：docker compose down 不会带走数据，只有 down -v 才会
  adc-pgdata:
    name: adc-pgdata

networks:
  adc-net:
    name: adc-net
    driver: bridge
